<script>
window.addEventListener('scroll',()=>{const b=document.getElementById('backTop');if(b)b.classList.toggle('show',window.scrollY>500)},{passive:true});
const $=id=>document.getElementById(id), cats=['全部','上衣','褲子','裙子','外套','配件','未分類'], CAT=new Set(cats);let db=null,clothes=[],looks=[],reviews=[],reviewCurrent=null,filter='全部',batch=false,selected=new Set(),current=null,changedImg=null,slots=[null,null,null,null,null,null],slotIndex=0,ocrWorker=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notify(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2700)}
function askConfirm(message,title='確定刪除？'){return new Promise(resolve=>{const layer=$('confirmLayer'),yes=$('confirmAccept'),no=$('confirmCancel');$('confirmTitle').textContent=title;$('confirmMessage').textContent=message;layer.classList.add('show');const finish=answer=>{layer.classList.remove('show');yes.onclick=null;no.onclick=null;layer.onclick=null;resolve(answer)};yes.onclick=()=>finish(true);no.onclick=()=>finish(false);layer.onclick=e=>{if(e.target===layer)finish(false)}})}

async function splitCatalogueGrid(im){

function removeWhiteBackground(src,strength){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{try{const w=im.naturalWidth,h=im.naturalHeight;if(w*h>3500000)throw new Error('圖片尺寸過大');const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);const data=ctx.getImageData(0,0,w,h),a=data.data;const marked=new Uint8Array(w*h);const queue=new Int32Array(w*h);let head=0,tail=0;

function autoBoardLayout(ids){
 // Three vertical bands (upper, lower, accessories). No auto-placed card overlaps.
 // Position by percentage in a 3-column layout, with each tier keeping its vertical order.
 const groups=[[],[],[],[]];for(const id of ids){const c=clothes.find(x=>x.id===id);groups[boardTier(c)].push(id)}
 const positions={};let cursor=3;
 const widthPct=31, heightPx=145, gapPx=12;
 const rows=[];
 // Upper garments at the top, outerwear follows; bottoms/skirts in the middle,
 // accessories use rightmost lane by default.
 for(const tier of [0,1,2,3]){
   const arr=groups[tier];if(!arr.length)continue;
   const cols=tier===3?1:3;
   for(let i=0;i<arr.length;i+=cols)rows.push({tier,items:arr.slice(i,i+cols)});

 let row=0;for(const entry of rows){const y=(16+row*(heightPx+gapPx))/height*100;
   entry.items.forEach((id,i)=>{let col=entry.tier===3?2:i;positions[id]={x:2+col*33,y};});row++;
 }
